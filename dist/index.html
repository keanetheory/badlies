<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bad Lies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Shrikhand&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E4F2DC; --card: #F6FBF1; --ink: #12281A; --muted: #496252; --edge: #12281A;
  --turf: #1D5C3A; --pink: #FF4F8B; --yellow: #FFD23F; --sky: #7FC8F8; --on-pink: #2a0713;
  --display: 'Shrikhand', 'Cooper Black', 'Georgia', serif;
  --body: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0E2A1B; --card: #173B27; --ink: #E9F5E1; --muted: #9FBDA6; --edge: #050F09; --turf: #2F8552; --pink: #FF5C93; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0E2A1B; --card: #173B27; --ink: #E9F5E1; --muted: #9FBDA6; --edge: #050F09; --turf: #2F8552; --pink: #FF5C93; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#app { position: relative; height: 100%; overflow: hidden; }
.screen { position: absolute; inset: 0; }
.screen.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.hidden { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.05; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* sticker buttons */
.btn { background: var(--card); color: var(--ink); border: 2.5px solid var(--edge); border-radius: 14px; padding: 11px 18px; font-weight: 800; box-shadow: 0 4px 0 var(--edge); transition: transform .06s, box-shadow .06s; touch-action: manipulation; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn.pink { background: var(--pink); color: var(--on-pink); }
.btn.yellow { background: var(--yellow); color: #2a2200; }
.btn.big { font-size: 1.15rem; padding: 14px 22px; }
.btn.small { padding: 7px 12px; border-radius: 10px; font-size: .9rem; box-shadow: 0 3px 0 var(--edge); }
.btn:disabled { opacity: .5; pointer-events: none; }
.ib { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 2.5px solid var(--edge); background: var(--card); font-size: 1.1rem; font-weight: 800; display: grid; place-items: center; padding: 0; }
.ib.dark { background: rgba(8, 26, 15, .7); color: #EAF6E2; border-color: rgba(234, 246, 226, .25); }
.ib.dark.on { background: var(--yellow); color: #2a2200; }

/* title */
#s-title { display: grid; place-items: center; background: #1D5C3A; }
#title-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.05); }
#s-title::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8, 30, 16, .15), rgba(8, 30, 16, .72) 62%, rgba(8, 30, 16, .9)); }
.title-wrap { position: relative; z-index: 1; width: min(440px, 100%); padding: 24px 22px 28px; align-self: end; color: #EAF6E2; }
.wordmark { font-size: clamp(5.2rem, 27vw, 8.5rem); color: var(--pink); transform: rotate(-5deg); transform-origin: left bottom; text-shadow: 0 5px 0 #2a0713, 0 12px 26px rgba(0, 0, 0, .45); display: flex; flex-direction: column; line-height: .82; margin-bottom: 26px; }
.wordmark span:last-child { color: var(--yellow); margin-left: .55em; }
.tagline { font-size: 1.15rem; font-weight: 600; max-width: 24ch; margin-bottom: 22px; }
.title-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.title-actions .big { grid-column: 1 / -1; }
.title-actions .big.half { grid-column: auto; padding-left: 12px; padding-right: 12px; }
.title-foot { margin-top: 16px; font-size: .9rem; opacity: .85; min-height: 1.4em; }
@media (prefers-reduced-motion: no-preference) { .wordmark { animation: plop .5s cubic-bezier(.2, 1.5, .4, 1) both; } }
@keyframes plop { from { transform: rotate(-14deg) scale(.6); opacity: 0; } }

/* pages */
.pagebar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg); border-bottom: 2.5px solid var(--edge); }
.pagebar h2 { font-size: 1.6rem; color: var(--turf); }
#page { max-width: 720px; margin: 0 auto; padding: 18px 16px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
#page > *, .card > *, ol > li { min-width: 0; }
.card { grid-template-columns: minmax(0, 1fr); }
.lede { font-size: 1.05rem; max-width: 60ch; }
.note { color: var(--muted); font-size: .92rem; max-width: 62ch; }
.card { background: var(--card); border: 2.5px solid var(--edge); border-radius: 18px; padding: 14px 16px; }
.pick { display: block; width: 100%; text-align: left; background: var(--card); border: 2.5px solid var(--edge); border-radius: 18px; padding: 14px 16px; box-shadow: 0 4px 0 var(--edge); }
.pick[aria-pressed="true"] { background: var(--yellow); color: #2a2200; transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.pick[aria-pressed="true"] .note { color: #5a4a00; }
.pick h3 { font-size: 1.35rem; margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.sec { font-family: var(--display); font-size: 1.25rem; color: var(--turf); margin-top: 6px; }
.rowwrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip { border: 2.5px solid var(--edge); border-radius: 999px; padding: 6px 14px 6px 8px; background: var(--card); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { background: var(--yellow); color: #2a2200; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--edge); flex: none; display: inline-block; }
.who { display: flex; align-items: center; gap: 12px; }
.badge { width: 52px; height: 52px; flex: none; border-radius: 50%; border: 2.5px solid var(--edge); display: grid; place-items: center; font-family: var(--display); font-size: 1.3rem; color: #12281A; box-shadow: 0 3px 0 var(--edge); }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; align-items: center; font-size: .9rem; margin-top: 10px; }
.bar { height: 10px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 14%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--turf); border-radius: 6px; }
.bar.xp i { background: var(--pink); }
.sticky-cta { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); display: grid; }
table.sc { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .92rem; }
table.sc th, table.sc td { padding: 6px 7px; text-align: center; border-bottom: 1.5px solid color-mix(in srgb, var(--ink) 18%, transparent); }
table.sc th:first-child, table.sc td:first-child { text-align: left; white-space: nowrap; }
table.sc .me td { font-weight: 800; }
table.sc .u { color: #c2185b; font-weight: 800; } table.sc .o { opacity: .75; }
.scwrap { overflow-x: auto; }
.verdict { font-size: clamp(2.2rem, 9vw, 3.4rem); color: var(--pink); transform: rotate(-2deg); }
.quote { border-left: 5px solid var(--pink); padding: 4px 0 4px 14px; font-size: 1.05rem; }
textarea, input[type=text], select { font: inherit; width: 100%; padding: 10px 12px; border: 2.5px solid var(--edge); border-radius: 12px; background: var(--card); color: var(--ink); }
textarea { min-height: 110px; resize: vertical; }
pre.code { background: #0c2416; color: #d7f0d0; padding: 12px; border-radius: 12px; overflow-x: auto; font-size: .8rem; margin: 0; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.preview { width: 100%; border-radius: 14px; border: 2.5px solid var(--edge); background: #17402a; display: block; max-height: 70vh; object-fit: contain; }
.thumbs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.thumbs figure { margin: 0; flex: none; width: 96px; font-size: .78rem; text-align: center; }
.thumbs canvas { width: 96px; height: 150px; object-fit: cover; border-radius: 10px; border: 2.5px solid var(--edge); display: block; margin-bottom: 4px; }

/* play */
#s-play { background: #0b2114; color: #EAF6E2; touch-action: none; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; left: 0; right: 0; padding: 8px 10px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud.top { top: 0; background: linear-gradient(rgba(6, 20, 12, .85), rgba(6, 20, 12, 0)); padding-bottom: 22px; }
.hrow { display: flex; align-items: center; gap: 8px; }
.hrow.two { margin-top: 6px; font-size: .88rem; justify-content: space-between; gap: 12px; text-shadow: 0 1px 3px #000; pointer-events: none; }
#h-fmt { font-family: var(--display); color: var(--yellow); font-size: 1rem; }
#h-status { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.holeinfo { flex: 1; min-width: 0; line-height: 1.15; text-shadow: 0 1px 3px #000; }
.holeinfo b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.holeinfo span { font-size: .85rem; opacity: .9; }
.wind { display: flex; flex-direction: column; align-items: center; font-size: .72rem; font-weight: 600; line-height: 1.1; min-width: 50px; text-align: center; text-shadow: 0 1px 3px #000; }
.wind .arrow { font-size: 1.35rem; display: block; color: var(--sky); transition: transform .4s; }
.wind.slope .arrow { color: var(--yellow); }
.hud.bottom { bottom: 0; background: linear-gradient(rgba(6, 20, 12, 0), rgba(6, 20, 12, .9) 34%); padding: 30px 12px 12px; display: grid; gap: 9px; }
#shotinfo { font-size: .95rem; min-height: 2.7em; text-shadow: 0 1px 3px #000; }
#shotinfo b { font-size: 1.1rem; color: var(--yellow); }
.btnrow { display: flex; gap: 10px; }
.btnrow .btn { flex: 1; }
#skip { flex: 0 0 auto; background: rgba(234, 246, 226, .14); color: #EAF6E2; border-color: rgba(234, 246, 226, .4); box-shadow: none; }
#meter { position: relative; height: 26px; border-radius: 9px; background: rgba(234, 246, 226, .16); border: 2px solid rgba(234, 246, 226, .5); overflow: hidden; }
#meter.idle { opacity: .45; }
#meter .m-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #3fe0c5, var(--yellow) 70%, var(--pink)); opacity: .8; }
#meter .m-acc { position: absolute; top: 0; bottom: 0; background: rgba(255, 255, 255, .5); border-inline: 2px solid #fff; }
#meter .m-tgt { position: absolute; top: 0; bottom: 0; background: rgba(255, 79, 139, .45); border-inline: 2px solid var(--pink); }
#meter .m-needle { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 6px #000; left: 8%; }
#meter span { position: absolute; top: 3px; font-size: .68rem; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; }
#meter .m-l { left: 13%; } #meter .m-r { right: 14%; }
#toast { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); width: max-content; max-width: min(92%, 440px); background: var(--yellow); color: #2a2200; font-weight: 800; padding: 8px 14px; border-radius: 12px; border: 2.5px solid #1a1400; box-shadow: 0 4px 0 #1a1400; text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 3; }
#toast.show { opacity: 1; }
#chirp { position: absolute; left: 10px; top: 158px; max-width: min(78%, 360px); background: #F6FBF1; color: #12281A; padding: 8px 12px 9px; border-radius: 4px 16px 16px 16px; border: 2.5px solid #07160e; font-size: .92rem; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 3; }
#chirp.show { opacity: 1; transform: none; }
#chirp b { display: flex; align-items: center; gap: 6px; font-size: .8rem; }
#chirp .dot { width: 12px; height: 12px; border-width: 1.5px; }
.modal { position: absolute; inset: 0; z-index: 10; background: rgba(4, 14, 8, .6); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.sheet { width: min(460px, 100%); background: var(--card); color: var(--ink); border: 2.5px solid var(--edge); border-radius: 20px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 6px 0 var(--edge); }
.sheet h3 { font-size: 1.7rem; color: var(--turf); }
.sheet .kicker { font-weight: 800; color: var(--pink); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .22s ease-out both; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
@media (min-width: 760px) { .hud.bottom { left: 50%; right: auto; transform: translateX(-50%); width: 520px; border-radius: 18px 18px 0 0; } }

</style>
</head>
<body>
<div id="app">
  <section id="s-title" class="screen">
    <canvas id="title-bg" aria-hidden="true"></canvas>
    <div class="title-wrap">
      <h1 class="wordmark"><span>Bad</span><span>Lies</span></h1>
      <p class="tagline">Golf for people who say “that one didn’t count.”</p>
      <div class="title-actions">
        <button class="btn yellow big half" data-act="quick">Quick start</button>
        <button class="btn pink big half" data-act="play">Play a round</button>
        <button class="btn" data-act="go" data-to="locker">Locker room</button>
        <button class="btn" data-act="go" data-to="rivals">Meet the rivals</button>
        <button class="btn" data-act="go" data-to="club">Golf club</button>
        <button class="btn" data-act="go" data-to="forge">Course Forger</button>
      </div>
      <p class="title-foot" id="title-foot"></p>
    </div>
  </section>

  <section id="s-page" class="screen scroll hidden">
    <header class="pagebar"><button class="ib" data-act="back" aria-label="Back">&#8592;</button><h2 id="page-title"></h2></header>
    <div id="page"></div>
  </section>

  <section id="s-play" class="screen hidden">
    <canvas id="cv"></canvas>
    <div class="hud top">
      <div class="hrow">
        <button class="ib dark" data-act="quit" aria-label="Leave the round">&#10005;</button>
        <div class="holeinfo"><b id="h-no"></b><span id="h-meta"></span></div>
        <div class="wind" id="h-windbox"><span class="arrow" id="h-arrow">&#10140;</span><span id="h-wind"></span></div>
        <button class="ib dark" data-act="view" aria-label="Toggle whole-hole view" id="b-view">&#9872;</button>
        <button class="ib dark" data-act="card" aria-label="Scorecard">&#9776;</button>
      </div>
      <div class="hrow two"><span id="h-fmt"></span><span id="h-status"></span></div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="chirp" aria-live="polite"></div>
    <div class="hud bottom">
      <div id="shotinfo"></div>
      <div id="meter" class="idle" aria-hidden="true">
        <div class="m-acc"></div><div class="m-tgt"></div><div class="m-fill"></div><div class="m-needle"></div>
        <span class="m-l">strike</span><span class="m-r">full</span>
      </div>
      <div class="btnrow">
        <button id="swing" class="btn pink big">Swing</button>
        <button id="skip" class="btn hidden">Skip ahead</button>
      </div>
    </div>
    <div id="modal" class="modal hidden"></div>
  </section>
</div>
<input type="file" id="file-img" accept="image/*" hidden>
<input type="file" id="file-geo" accept=".json,.geojson,application/json,application/geo+json" hidden>
<script>
(function () {
'use strict';
// ---------- 01-util: rng, geometry, noise ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const smooth = t => t * t * (3 - 2 * t);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function gauss(rng) { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rng()); }
const pick = (arr, rng = Math.random) => arr[Math.floor(rng() * arr.length)];
function shuffle(arr, rng = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function pointInPoly(p, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) c = !c;
  }
  return c;
}
function polyBB(poly) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const p of poly) { if (p.x < a) a = p.x; if (p.y < b) b = p.y; if (p.x > c) c = p.x; if (p.y > d) d = p.y; } return [a, b, c, d]; }
function centroid(poly) { let x = 0, y = 0; for (const p of poly) { x += p.x; y += p.y; } return { x: x / poly.length, y: y / poly.length }; }
function polyRadius(poly, c) { let r = 0; for (const p of poly) r += dist(p, c); return r / poly.length; }

// Wobbly ellipse — the basic building block of greens, bunkers and ponds.
function blob(cx, cy, rx, ry, rng, n = 20, wob = 0.2, rot = 0) {
  const k1 = 2 + Math.floor(rng() * 2), k2 = 3 + Math.floor(rng() * 3), p1 = rng() * TAU, p2 = rng() * TAU;
  const pts = [], cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const w = 1 + wob * (0.6 * Math.sin(k1 * a + p1) + 0.4 * Math.sin(k2 * a + p2));
    const x = Math.cos(a) * rx * w, y = Math.sin(a) * ry * w;

}
function chaikin(pts, iter = 2) {
  let p = pts;
  for (let k = 0; k < iter; k++) {
    const q = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      q.push({ x: a.x * .75 + b.x * .25, y: a.y * .75 + b.y * .25 }, { x: a.x * .25 + b.x * .75, y: a.y * .25 + b.y * .75 });

    p = q;
  }
  return p;
}
function catmullRom(pts, step = 5) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const n = Math.max(2, Math.ceil(dist(p1, p2) / step));
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => .5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push({ x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y) });
    }
  }

  return out;
}
function cumLen(path) { const L = [0]; for (let i = 1; i < path.length; i++) L.push(L[i - 1] + dist(path[i - 1], path[i])); return L; }
function pointAtDist(path, L, d) {
  d = clamp(d, 0, L[L.length - 1]);
  let i = 1; while (i < L.length - 1 && L[i] < d) i++;
  const t = (d - L[i - 1]) / Math.max(1e-6, L[i] - L[i - 1]);
  return { x: lerp(path[i - 1].x, path[i].x, t), y: lerp(path[i - 1].y, path[i].y, t), i };
}
function nearestIdx(path, p) { let bi = 0, bd = 1e9; for (let i = 0; i < path.length; i++) { const d = dist(path[i], p); if (d < bd) { bd = d; bi = i; } } return { i: bi, d: bd }; }
function rotatePt(p, o, a) { const c = Math.cos(a), s = Math.sin(a), x = p.x - o.x, y = p.y - o.y; return { x: o.x + x * c - y * s, y: o.y + x * s + y * c }; }

// Value noise with octaves; world-space so every render of a hole agrees.

// ---------- 04-engine: shots, putting physics, skills ----------
const SKILLS = ['drive', 'approach', 'chip', 'sand', 'putt'];
const SKILL_NAME = { drive: 'Driving', approach: 'Approach', chip: 'Chipping', sand: 'Sand play', putt: 'Putting' };
const LIE_NAME = { tee: 'Tee', fairway: 'Fairway', rough: 'Rough', sand: 'Bunker', trees: 'Trees', green: 'Green' };
const MAX_LEVEL = 10;
const xpNeed = lvl => 60 + 40 * lvl;

function shotCat(h, ball) {
  if (ball.lie === 'green') return 'putt';
  if (ball.lie === 'sand') return 'sand';
  if (ball.shots === 0 && h.par > 3) return 'drive';
  return dist(ball.pos, h.pin) < 55 ? 'chip' : 'approach';
}
function maxDist(p, cat, lie) {
  const s = p.skills; let m;
  if (cat === 'drive') m = 205 + 8 * s.drive;
  else if (cat === 'approach') m = 178 + 5 * s.approach;
  else if (cat === 'chip') m = 70;
  else if (cat === 'sand') m = 95 + 7 * s.sand;
  else m = 60;

  return m;
}
// One standard deviation of angle (radians) and distance (fraction) for a player on a kind of shot.
function sigma(p, cat, lie) {
  const L = p.skills[cat]; let a, d;
  if (cat === 'drive') { a = 7 - .5 * L; d = .06 - .003 * L; }
  else if (cat === 'approach') { a = 6.6 - .48 * L; d = .1 - .007 * L; }
  else if (cat === 'chip') { a = 6 - .4 * L; d = .2 - .014 * L; }
  else if (cat === 'sand') { a = 9 - .6 * L; d = .28 - .02 * L; }
  else { a = 2.6 - .2 * L; d = .15 - .011 * L; }
  const k = lie === 'rough' ? 1.3 : lie === 'trees' ? 1.6 : 1;
  return { a: a * k * Math.PI / 180, d: d * k };
}
function clubName(cat, d, max) {
  if (cat === 'putt') return 'Putter';
  if (cat === 'sand') return 'Sand wedge';
  if (cat === 'chip') return d < 25 ? 'Chip' : 'Pitch';
  if (cat === 'drive') return d > max * .86 ? 'Driver' : d > max * .74 ? '3-wood' : 'Hybrid';
  const t = [[212, '3-wood'], [196, 'Hybrid'], [182, '4-iron'], [171, '5-iron'], [160, '6-iron'], [149, '7-iron'], [138, '8-iron'], [126, '9-iron'], [110, 'Pitching wedge'], [92, 'Gap wedge'], [72, 'Sand wedge']];
  for (const [y, n] of t) if (d > y) return n;
  return 'Lob wedge';
}
const ROLL = { drive: .12, approach: .06, chip: .4, sand: .25 };

// Full-swing shot. exec = { power: 1 is "as intended", ang: radians off line }.
function resolveShot(h, from, lie, target, exec, cat, wind) {
  const D = Math.hypot(target.x - from.x, target.y - from.y) || .01;
  const th = Math.atan2(target.y - from.y, target.x - from.x) + exec.ang, ux = Math.cos(th), uy = Math.sin(th);
  const total = D * exec.power, rf = ROLL[cat], carry = total * (1 - rf);
  let roll = total * rf;
  const wk = (cat === 'chip' || cat === 'sand') ? .002 : .0045;
  const land = { x: from.x + ux * carry + wind.x * carry * wk, y: from.y + uy * carry + wind.y * carry * wk };
  const res = { from, land, end: land, lie: 'rough', penalty: 0, holed: false, event: 'ok', carry, total };
  const s0 = surfaceAt(h, land);
  if (s0 === 'ob') { res.event = 'ob'; res.penalty = 1; res.end = { ...from }; res.lie = lie; return res; }
  if (s0 === 'water') return wetDrop(h, res, from, land, lie);
  if (s0 === 'trees') { res.lie = 'trees'; res.event = 'trees'; return res; }
  if (s0 === 'sand') { res.lie = 'sand'; return res; }
  if (s0 === 'green' && dist(land, h.pin) < .25) { res.holed = true; res.end = { ...h.pin }; res.lie = 'green'; return res; }
  if (s0 === 'rough') roll *= .35;

    if (s === 'ob') break;
    if (s === 'water') { res.end = nx; return wetDrop(h, res, pos, nx, lie); }
    pos = nx; cur = s;
    if (s === 'sand' || s === 'trees') break;
    if (s === 'green' && dist(pos, h.pin) < .2 && (n - i) * step < 2.2) { res.holed = true; pos = { ...h.pin }; break; }

// Putting: a little rolling-ball sim with friction and a constant green slope.
const PUTT_A = 2.0, CUP_R = .1, CUP_V = 2.7;
function simulatePutt(h, from, ang, d) {
  const v0 = Math.sqrt(2 * PUTT_A * Math.max(.05, d));

    if (vx * Math.cos(ang) + vy * Math.sin(ang) < 0 && sp < .3) break; // don't trickle back uphill forever

    const dp = Math.hypot(x - h.pin.x, y - h.pin.y); if (dp < minD) minD = dp;

    if (i % 2 === 0) pts.push({ x, y });

// What a competent caddie would tell you: the line and weight that give the ball its best chance.
function bestPuttAim(h, from) {
  const base = Math.atan2(h.pin.y - from.y, h.pin.x - from.x), D = dist(from, h.pin);
  let best = null;
  const tryIt = (off, mult) => {
    const r = simulatePutt(h, from, base + off, D * mult + .3), score = r.holed ? -1 + Math.abs(mult - 1.06) * .1 : dist(r.end, h.pin) + r.minD;

  };
  for (let a = -8; a <= 8; a++) for (const m of [.85, .95, 1.05, 1.15, 1.3]) tryIt(a * .035, m);
  const c = { ...best };
  for (let a = -3; a <= 3; a++) for (const m of [-.04, 0, .04]) tryIt(c.ang - base + a * .009, (c.d - .3) / D + m);

function shotQuality(h, cat, before, res) {

  if (res.penalty) return 0;
  if (cat === 'drive') return res.lie === 'fairway' ? clamp(.6 + res.total / 600, 0, 1) : res.lie === 'rough' ? .4 : res.lie === 'green' ? 1 : .15;

// The rival's plan for the next hole. lead = how far ahead they are (holes or points), left = holes still to play.
function planHole(pl, lead, left, points) {

function bindPlay() {
  const cv = $('cv'); G.ctx = cv.getContext('2d');
  const world = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - G.cw / 2) / G.cam.s + G.cam.x, y: (e.clientY - r.top - G.cyU) / G.cam.s + G.cam.y }; };
  cv.addEventListener('pointerdown', e => { const T = G.turn; if (!T) return; if (T.mode === 'aim') { G.drag = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} setTarget(world(e)); } else onSwing(); });
  cv.addEventListener('pointermove', e => { if (G.drag && G.turn && G.turn.mode === 'aim') setTarget(world(e)); });
  const up = () => { G.drag = false; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  $('swing').addEventListener('click', onSwing);

    if (!$('s-play').classList.contains('hidden') && (e.code === 'Space' || e.code.startsWith('Arrow')) && !/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName)) e.preventDefault();
    const T = G.turn; if (!T || $('s-play').classList.contains('hidden') || document.querySelector('#s-play .modal')) return;
    if (e.code === 'Space' || e.code === 'Enter') { if (e.target === $('swing')) return; e.preventDefault(); onSwing(); }
    else if (T.mode === 'aim' && e.code.startsWith('Arrow')) {
      e.preventDefault(); const b = T.ball.pos, st = T.cat === 'putt' ? .25 : 3; let a = Math.atan2(T.target.y - b.y, T.target.x - b.x), d = dist(b, T.target);
      if (e.code === 'ArrowLeft') a -= st / Math.max(d, 4); if (e.code === 'ArrowRight') a += st / Math.max(d, 4); if (e.code === 'ArrowUp') d += st; if (e.code === 'ArrowDown') d -= st;
      setTarget({ x: b.x + Math.cos(a) * d, y: b.y + Math.sin(a) * d });
    }

}

function chargeSubs() {
  const c = myClub(); if (!c || save.stats.rounds < save.club.due) return '';
  const fee = clubFee(c);
  if (save.cash >= fee) { save.cash = round2(save.cash - fee); save.club.due += SUBS_EVERY; return fee ? `${c.name} took ${money(fee)} in subs. Next due after round ${save.club.due}.` : `${c.name} renewed your membership for nothing. Enjoy it while it lasts.`; }
  const alt = CLUBS.filter(x => x.id !== c.id && clubFee(x) <= save.cash).sort((a, b) => clubFee(a) - clubFee(b))[0];
  if (alt) { const f = clubFee(alt); save.cash = round2(save.cash - f); save.club = { id: alt.id, due: save.stats.rounds + SUBS_EVERY }; return `You couldn’t cover the ${money(fee)} subs at ${c.name}, so you’re now a member of ${alt.name}${f ? ` (${money(f)})` : ''}.`; }

// ---------- round start / end ----------
function teeOff() { startRound({ fmt: U.fmt, total: U.total, course: U.course, rivals: U.rivals.slice(), stake: stakeNow() }); }
function quickTee() {
  if (!Q.course || !Q.n) return;
  if (!golfer()) ACTS.golfer({ id: Q.golfer }, true);
  startRound({ fmt: 'strokeplay', total: QUICK_HOLES, course: Q.course, rivals: [], size: Q.n + 1, stake: stakeNow() });
}
// cfg: { fmt, total, course, rivals, size?, stake? }. size overrides the format's player count (strokeplay plays 2 to 4).
// The stake leaves the wallet at the first tee; walking off forfeits it.
function startRound(cfg) {
  if (!save.golfer) return go('golfer');
  lastCfg = cfg;
  const f = FORMATS[cfg.fmt], n = cfg.size || f.n, g = golfer(), C = getCourse(cfg.course, courses);
  let ids = cfg.rivals.slice(0, n - 1);
  for (const x of shuffle(NPCS)) if (ids.length < n - 1 && !ids.includes(x.id)) ids.push(x.id);
  const mk = n => ({ ...n, skills: { ...n.skills }, _used: {} });
  const me = { id: 'me', name: g.name, short: 'You', human: true, color: '#ffffff', skills: levels(mySkills()) };
  const R = newRound({ format: cfg.fmt, holes: C.holes, total: cfg.total, theme: C.theme, courseName: C.name, seed: Date.now() >>> 0, players: [me, ...ids.map(id => mk(NPCS.find(n => n.id === id)))], field: cfg.fmt === 'stableford' ? NPCS.filter(n => !ids.includes(n.id)).map(mk) : [] });
  R.stake = Math.max(0, Math.min(cfg.stake || 0, MAX_STAKE, Math.floor(save.cash)));
  if (R.stake) { save.cash = round2(save.cash - R.stake); persist(); }
  G.hooks.seenHint = save.stats.holes > 0;
  show('play'); playRound(R);
}
G.hooks.xp = (cat, amt) => { const sk = mySkills(), before = sk[cat].lvl; addXp(sk, cat, amt); G.xp[cat] = (G.xp[cat] || 0) + amt; saveLocal(); if (sk[cat].lvl > before) { G.R.players[0].skills[cat] = sk[cat].lvl; (G.ups = G.ups || []).push(cat); return sk[cat].lvl; } return null; };
G.hooks.holeDone = () => { save.stats.holes++; persist(); };
G.onEnd = (R, run) => {
  const st = standings(R), won = st.won && !st.tied, gains = { ...G.xp }, ups = (G.ups || []).slice(); G.ups = [];
  save.stats.rounds++; if (won) { save.stats.wins++; for (const k of SKILLS) { const b = mySkills()[k].lvl; addXp(mySkills(), k, 25); if (mySkills()[k].lvl > b) ups.push(k); } }
  R.players.forEach((p, i) => {
    if (p.human || (R.teams && i === 1)) return;
    const r = save.h2h[p.id] = save.h2h[p.id] || { w: 0, l: 0 }, d = st.match ? R.up : st.low ? R.pts[i] - R.pts[0] : R.pts[0] - R.pts[i];
    if (d > 0) r.w++; else if (d < 0) r.l++;
  });
  const share = potShare(R, R.stake); save.cash = round2(save.cash + share);
  const cash = { stake: R.stake, pot: R.stake * R.players.length, share, subs: chargeSubs() };
  persist();
  const rival = R.players[R.teams ? 2 : 1], q = { line: cannedLine(rival, won ? 'lose' : st.tied ? 'sulk' : 'win'), by: rival.name };
  lastRound = { R, st, gains, ups, quote: q, cash };
  nav.length = 0; go('result');
};

// ---------- Course Forger ----------
function sampleGeo() {
  // A pretend OpenStreetMap export, built from three house holes, so the importer has something to chew on.
  const C = getCourse('sodden'), lat0 = 51.2345, lon0 = -0.5432, kx = Math.cos(lat0 * Math.PI / 180) * 111320 * YD, ky = 110540 * YD, feats = [];
  [0, 1, 4].forEach((hi, k) => {
    const h = C.holes[hi], ll = p => [+(lon0 + (p.x + k * 320) / kx).toFixed(6), +(lat0 - p.y / ky).toFixed(6)], ring = poly => [[...poly.map(ll), ll(poly[0])]];
    const add = (tags, type, coordinates) => feats.push({ type: 'Feature', properties: tags, geometry: { type, coordinates } });
    add({ golf: 'hole', ref: String(k + 1), par: String(h.par), name: h.name }, 'LineString', h.path.filter((p, i) => i % 12 === 0 || i === h.path.length - 1).map(ll));
    h.fairways.forEach(p => add({ golf: 'fairway' }, 'Polygon', ring(p))); h.greens.forEach(p => add({ golf: 'green' }, 'Polygon', ring(p)));
    h.bunkers.forEach(p => add({ golf: 'bunker' }, 'Polygon', ring(p))); h.waters.forEach(p => add({ natural: 'water' }, 'Polygon', ring(p)));
    add({ golf: 'tee' }, 'Polygon', ring(h.teeBox)); h.trees.filter((t, i) => i % 2 === 0).forEach(t => add({ natural: 'tree' }, 'Point', ll(t)));
  });
  return JSON.stringify({ type: 'FeatureCollection', features: feats });
}

PAGES.forge[2] = () => {

function forgeRead() { for (const [id, k] of [['f-words', 'words'], ['f-hint', 'hint'], ['f-lat', 'lat'], ['f-geo', 'geo'], ['f-name', 'name']]) if ($(id)) F[k] = $(id).value; }
function forgeAdd(holes, msg) { F.holes.push(...holes); F.holes = F.holes.slice(0, 18); F.sel = F.holes.length - 1; F.msg = msg; F.busy = false; renderPage(true); const b = $('f-preview'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
function forgeFail(e) { F.busy = false; F.msg = (e && e.message) || 'That didn’t work. Try again with something clearer.'; renderPage(true); }
async function forgeWords() {
  forgeRead(); const text = (F.words || '').trim(); if (!text) { F.msg = 'Give me something to work with. A par and a shape will do.'; return renderPage(true); }

    let h = null;

    if (!h) h = describeLocally(text, seed);

}
async function forgeShot() {

  tee: teeOff, again() { if (lastCfg) startRound({ ...lastCfg, stake: stakeNow() }); else teeOff(); },
  async quit() { if (await modal(`<h3>Walking off?</h3><p>Your experience is safe. Your reputation is not.${G.R && G.R.stake ? ` Your ${money(G.R.stake)} stake stays in the pot.` : ''}</p><button class="btn" data-val="no">Keep playing</button><button class="btn pink" data-val="yes">Walk off</button>`) === 'yes') { quitRound(); persist(); home(); } },
  view() { G.overview = !G.overview; $('b-view').classList.toggle('on', G.overview); const h = G.R.h; if (G.turn) aimCamera(); else if (G.overview) frame([h.tee, h.pin, ...h.path], 30, 80); },
  card() { modal(`<h3>The card</h3><p class="note">${esc(FORMATS[G.R.fmt].name)} at ${esc(G.R.courseName)}. ${esc(statusText(G.R))}</p>${scorecardHtml(G.R)}<button class="btn pink" data-val="x">Back to it</button>`); },
  'f-tab'(d) { forgeRead(); F.tab = d.id; F.msg = ''; renderPage(true); },
  'f-words': forgeWords, 'f-shot': forgeShot, 'f-geo'() { forgeGeo(); },
  'f-sample'() { forgeGeo(sampleGeo()); },
  'f-pick-img'() { forgeRead(); $('file-img').click(); }, 'f-pick-geo'() { forgeRead(); $('file-geo').click(); },
  'f-copy'() { forgeRead(); const t = $('f-query').textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { F.msg = 'Query copied.'; renderPage(true); }, () => { F.msg = 'Couldn’t reach the clipboard. Select the query and copy it by hand.'; renderPage(true); }); },
  'f-sel'(d) { forgeRead(); F.sel = +d.id; renderPage(true); },
  'f-del'() { forgeRead(); F.holes.splice(F.sel, 1); F.sel = Math.max(0, F.sel - 1); F.msg = ''; renderPage(true); },
  'f-theme'(d) { forgeRead(); F.theme = d.id; renderPage(true); },
  'f-save': forgeSave,
  'f-play'(d) { U.course = d.id; if (!save.golfer) { G.afterGolfer = 'setup'; go('golfer'); } else go('setup'); },
  'f-rm'(d) { courses = courses.filter(c => c.id !== d.id); delete holeCache[d.id]; saveCourses(); Store.del('course_' + d.id); if (U.course === d.id) U.course = 'sodden'; renderPage(true); },
};
function boot() {
  loadLocal(); dailyBonus(); bindPlay(); titleFoot();
  document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACTS[b.dataset.act] && !b.disabled) ACTS[b.dataset.act](b.dataset); });
  document.addEventListener('change', e => { if (e.target.id === 'f-lat') { forgeRead(); renderPage(true); } });
  $('file-img').addEventListener('change', e => { F.file = e.target.files[0] || null; F.msg = ''; e.target.value = ''; renderPage(true); });
  $('file-geo').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { F.geo = ''; forgeGeo(await f.text()); } catch (err) { forgeFail(err); } });
  // title backdrop: one of the house holes, painted by the same renderer the game uses
  setTimeout(() => { try { const h = getCourse('sodden').holes[4], r = renderRegion(h, 'lush', 0, 0, h.w, h.h, 2.2), bg = $('title-bg'); bg.width = r.width; bg.height = r.height; bg.getContext('2d').drawImage(r, 0, 0); } catch (e) {} }, 30);
  AI.init();
  Store.init().then(() => Store.pull()).then(remote => {
    if (!remote) return;
    if (remote.career && remote.career.v === 1 && (remote.career.t || 0) > (save.t || 0) && $('s-play').classList.contains('hidden')) { save = Object.assign(save, remote.career); saveLocal(); dailyBonus(); }
    for (const c of remote.courses) if (c && c.id && Array.isArray(c.holes) && !courses.some(x => x.id === c.id)) courses.push(c);
    saveCourses(); titleFoot(); if (nav.length && !$('s-page').classList.contains('hidden')) { forgeRead(); renderPage(true); }
  });
  window.__badlies = { G, AI, get save() { return save; }, importGeo, sampleGeo, describeLocally, specToHole, onSwing };
}
boot();

})();
</script>
